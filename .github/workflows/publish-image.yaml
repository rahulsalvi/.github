---
name: Publish image

on:
  workflow_call:
    inputs:
      config_file:
        required: false
        type: string
        default: container-config.yaml
      dockerfile:
        required: false
        type: string
      context:
        required: false
        type: string
      registry:
        required: false
        type: string
      image_name:
        required: false
        type: string
      hadolint:
        required: false
        type: string
      attestation:
        required: false
        type: string
    outputs:
      version:
        value: ${{ jobs.publish-image.outputs.version }}

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.calver.outputs.next_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Load config
        id: config
        run: |
          CONFIG_FILE="${{ inputs.config_file }}"

          resolve() {
            local key=$1 default=$2
            local val="${!key}"
            local yaml_key
            yaml_key=$(echo "$key" | tr '[:upper:]' '[:lower:]')
            if [ -z "$val" ] && [ -f "$CONFIG_FILE" ]; then
              val=$(yq -r ".$yaml_key // empty" "$CONFIG_FILE")
            fi
            [ -z "$val" ] && val="$default"
            echo "$key=$val" >> $GITHUB_ENV
          }

          DOCKERFILE="${{ inputs.dockerfile }}"
          CONTEXT="${{ inputs.context }}"
          REGISTRY="${{ inputs.registry }}"
          IMAGE_NAME="${{ inputs.image_name }}"
          HADOLINT="${{ inputs.hadolint }}"
          ATTESTATION="${{ inputs.attestation }}"

          resolve DOCKERFILE     "Dockerfile"
          resolve CONTEXT        "."
          resolve REGISTRY       "ghcr.io"
          resolve IMAGE_NAME     "${{ github.repository }}"
          resolve HADOLINT       "true"
          resolve ATTESTATION    "true"

          echo "Image:          $REGISTRY/$IMAGE_NAME"
          echo "Dockerfile:     $DOCKERFILE"
          echo "Context:        $CONTEXT"
          echo "Hadolint:       $HADOLINT"
          echo "Attestation:    $ATTESTATION"

      - name: Calver
        uses: energostack/calver-action@v1
        id: calver
        with:
          date_format: "%Y.%-m"

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run hadolint
        if: env.HADOLINT == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ env.CONTEXT }}/${{ env.DOCKERFILE }}
          verbose: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},value=${{ steps.calver.outputs.next_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.calver.outputs.next_version }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        if: env.ATTESTATION == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
